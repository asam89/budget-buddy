<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Budget Buddy</title>
  <!-- Banknote buddy, tilted a little for personality -->
  <g transform="rotate(-7 31 36)">
    <rect x="2.5" y="13" width="56" height="45" rx="10" fill="#10b981" stroke="#065f46" stroke-width="3.5"/>
    <rect x="8.5" y="19" width="44" height="33" rx="6" fill="none" stroke="#a7f3d0" stroke-width="1.8" opacity=".75"/>
    <!-- cheeks -->
    <circle cx="15" cy="41" r="4.2" fill="#f9a8d4" opacity=".9"/>
    <circle cx="46" cy="41" r="4.2" fill="#f9a8d4" opacity=".9"/>
    <!-- eyes -->
    <ellipse cx="22" cy="32" rx="4.2" ry="5" fill="#052e2b"/>
    <ellipse cx="39" cy="32" rx="4.2" ry="5" fill="#052e2b"/>
    <circle cx="23.6" cy="30.2" r="1.6" fill="#fff"/>
    <circle cx="40.6" cy="30.2" r="1.6" fill="#fff"/>
    <!-- smile -->
    <path d="M24 42 Q30.5 49 37 42" fill="none" stroke="#052e2b" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- gold coin sidekick -->
  <circle cx="52.5" cy="11.5" r="9.5" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
  <path d="M55.5 7.6c-.8-.9-2-1.4-3.3-1.4-1.9 0-3.3 1-3.3 2.5 0 3.4 6.9 1.9 6.9 5.5 0 1.6-1.5 2.7-3.6 2.7-1.5 0-2.8-.6-3.7-1.6M52.5 4.4v14.2" fill="none" stroke="#7c2d12" stroke-width="1.9" stroke-linecap="round"/>
</svg>
