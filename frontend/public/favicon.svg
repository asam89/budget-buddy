<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Budget Buddy</title>
  <!-- Coin buddy: an 11-sided gold dollar coin with a face, arms and feet -->
  <!-- feet -->
  <ellipse cx="24" cy="59" rx="6" ry="3.6" fill="#92400e"/>
  <ellipse cx="40" cy="59" rx="6" ry="3.6" fill="#92400e"/>
  <!-- arms: left resting, right waving -->
  <path d="M8.5 37 Q3 40 4 46" fill="none" stroke="#92400e" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M55.5 27 Q61 22 59 15" fill="none" stroke="#92400e" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="4.2" cy="47" r="3" fill="#fbbf24" stroke="#92400e" stroke-width="1.8"/>
  <circle cx="58.8" cy="13.8" r="3" fill="#fbbf24" stroke="#92400e" stroke-width="1.8"/>
  <!-- coin body -->
  <polygon points="32.0,6.0 45.5,10.0 54.7,20.6 56.7,34.6 50.9,47.4 39.0,55.0 25.0,55.0 13.1,47.4 7.3,34.6 9.3,20.6 18.5,10.0"
           fill="#f59e0b" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="32.0,11.5 42.5,14.6 49.7,22.9 51.3,33.8 46.7,43.8 37.5,49.7 26.5,49.7 17.3,43.8 12.7,33.8 14.3,22.9 21.5,14.6"
           fill="#fcd34d" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- shine -->
  <path d="M19 19 Q24 14 30 13.5" fill="none" stroke="#fffbeb" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <!-- cheeks -->
  <circle cx="19.5" cy="36.5" r="3.6" fill="#fb923c" opacity=".55"/>
  <circle cx="44.5" cy="36.5" r="3.6" fill="#fb923c" opacity=".55"/>
  <!-- eyes -->
  <ellipse cx="25" cy="29" rx="3.6" ry="4.4" fill="#3b1d06"/>
  <ellipse cx="39" cy="29" rx="3.6" ry="4.4" fill="#3b1d06"/>
  <circle cx="26.3" cy="27.4" r="1.4" fill="#fff"/>
  <circle cx="40.3" cy="27.4" r="1.4" fill="#fff"/>
  <!-- smile -->
  <path d="M26 38 Q32 44.5 38 38" fill="none" stroke="#3b1d06" stroke-width="3" stroke-linecap="round"/>
</svg>
